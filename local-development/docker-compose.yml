# Local development only. Every variable has a default that matches application-local.properties, so no
# .env file is needed. To override a value (or to pass OPENAI_API_KEY), set it in your shell or in
# local-development/.env (see .env.example).
#
# `docker compose up` starts only the backing services and the Dozzle log viewer (run the app from the IDE with
# the local profile).
# `docker compose --profile full up --build` also builds and starts the app container (local profile).
# `--profile ollama` also starts Ollama and pulls the model (about 4.7 GB) for the opt-in local verifier.
services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: knowgauge-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowgauge}
      POSTGRES_USER: ${POSTGRES_USER:-knowgauge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowgauge_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [knowgauge-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-vectors:
    image: pgvector/pgvector:pg15
    container_name: knowgauge-postgres-vectors
    environment:
      POSTGRES_DB: ${POSTGRES_VECTORS_DB:-knowgauge_vectors}
      POSTGRES_USER: ${POSTGRES_VECTORS_USER:-knowgauge_user}
      POSTGRES_PASSWORD: ${POSTGRES_VECTORS_PASSWORD:-knowgauge_pass}
    ports:
      - "5433:5432"   # host 5433 -> container 5432 (avoid conflict with main)
    volumes:
      - postgres_vectors_data:/var/lib/postgresql/data
    networks: [knowgauge-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # minio/minio was deleted from Docker Hub (and quay.io/minio/minio closed to anonymous pulls) in Sept 2026.
    # Chainguard's image runs the same MinIO server. It runs as UID 65532 by default; root avoids
    # "file access denied" on the named volume. It has no shell or curl, so there is no healthcheck.
    image: cgr.dev/chainguard/minio:latest
    container_name: knowgauge-minio
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks: [knowgauge-network]

  # Log viewer for every container on this Docker host: http://localhost:8888 (live tail, search, level filters,
  # JSON shown as fields). No login, so it listens on localhost only. Reads the Docker socket and stores nothing.
  dozzle:
    image: amir20/dozzle:latest
    container_name: knowgauge-dozzle
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [knowgauge-network]

  # Catches every email the service sends (invitations). SMTP on 1025, inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: knowgauge-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks: [knowgauge-network]

  # Sign-in (ADR010): Keycloak with the knowgauge realm imported from keycloak/knowgauge-realm.json on the first
  # start (realm, UI client, roles and the users admin / alice / bob). Used when the app runs with
  # KG_SECURITY_MODE=oidc. Admin console: http://localhost:8180 (KC_BOOTSTRAP_ADMIN_*, master realm).
  # Registration and password-reset emails go to Mailpit. Delete the keycloak_data volume to import the realm again.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: knowgauge-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      # The KnowGauge application admin (APPLICATION_ADMIN realm role) created by the realm import
      KG_ADMIN_EMAIL: ${KG_ADMIN_EMAIL:-admin@knowgauge.local}
      KG_ADMIN_PASSWORD: ${KG_ADMIN_PASSWORD:-admin-pass}
      # Where the UI runs (redirect URIs of the knowgauge-ui client)
      KG_UI_URL: ${KG_UI_URL:-http://localhost:5173}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # The KnowGauge login theme (loginTheme in the realm), built in know-gauge-ui with `npm run build-keycloak-theme`.
      # Without it Keycloak shows its own pages. Stop keycloak while rebuilding the theme (Windows locks the mounted jar).
      - ${KG_KEYCLOAK_THEME_DIR:-../../know-gauge-ui/dist_keycloak}:/opt/keycloak/providers:ro
      # The whole data folder (owned by the keycloak user in the image); the import folder is mounted inside it
      - keycloak_data:/opt/keycloak/data
    networks: [knowgauge-network]

  # Opt-in local LLM for distractor verification (kg.testgen.verification.provider=ollama). Not started by default.
  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    container_name: knowgauge-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks: [knowgauge-network]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: pulls the verification model into the ollama volume, then exits.
  ollama-pull:
    profiles: [ollama]
    image: ollama/ollama:latest
    container_name: knowgauge-ollama-pull
    entrypoint: ["ollama", "pull", "${KG_OLLAMA_MODEL:-qwen2.5:7b-instruct}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks: [knowgauge-network]
    restart: "no"

  knowgauge-service:
    profiles: [full]
    image: knowgauge-service
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: knowgauge-service
    environment:
      SPRING_PROFILES_ACTIVE: local

      # Main DB (Spring default datasource)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-knowgauge}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-knowgauge_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-knowgauge_pass}

      # Vector DB (kg.pgvector.datasource.*, bound to DataSourceProperties)
      KG_PGVECTOR_DATASOURCE_URL: jdbc:postgresql://postgres-vectors:5432/${POSTGRES_VECTORS_DB:-knowgauge_vectors}
      KG_PGVECTOR_DATASOURCE_USERNAME: ${POSTGRES_VECTORS_USER:-knowgauge_user}
      KG_PGVECTOR_DATASOURCE_PASSWORD: ${POSTGRES_VECTORS_PASSWORD:-knowgauge_pass}
      KG_PGVECTOR_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      # MinIO (kg.storage.endpoint / accessKey / secretKey)
      KG_STORAGE_ENDPOINT: http://minio:9000
      KG_STORAGE_ACCESSKEY: ${MINIO_ROOT_USER:-minio}
      KG_STORAGE_SECRETKEY: ${MINIO_ROOT_PASSWORD:-minio12345}

      # Mailpit (spring.mail.host) and the UI address used in invitation links
      SPRING_MAIL_HOST: mailpit
      KG_INVITATIONS_LINKBASEURL: ${KG_UI_URL:-http://localhost:5173}

      # Sign-in (ADR010): fixed (no sign-in) or oidc (Keycloak above). Tokens carry the browser's issuer
      # (localhost:8180); the app fetches the signing keys inside the network.
      KG_SECURITY_MODE: ${KG_SECURITY_MODE:-fixed}
      KG_OIDC_ISSUER_URI: http://localhost:8180/realms/knowgauge
      KG_OIDC_JWK_SET_URI: http://keycloak:8080/realms/knowgauge/protocol/openid-connect/certs

      # OpenAI (no default; needed for ingestion and test generation)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # Ollama verifier, only used with KG_TESTGEN_VERIFICATION_PROVIDER=ollama and `--profile ollama`
      KG_TESTGEN_VERIFICATION_PROVIDER: ${KG_TESTGEN_VERIFICATION_PROVIDER:-openai}
      KG_TESTGEN_VERIFICATION_CHATMODEL_OLLAMA_BASEURL: http://ollama:11434
      KG_TESTGEN_VERIFICATION_CHATMODEL_OLLAMA_MODEL: ${KG_OLLAMA_MODEL:-qwen2.5:7b-instruct}

      # Uncomment for JSON logs (as in prod) instead of plain text, e.g. to try field filters in Dozzle
      # LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs

      # Optional debug
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "8080:8080"
      - "5005:5005"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-vectors:
        condition: service_healthy
      minio:
        condition: service_started
      mailpit:
        condition: service_started
    networks: [knowgauge-network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  keycloak_data:
  postgres_data:
  postgres_vectors_data:
  minio_data:
  ollama_data:

networks:
  knowgauge-network:
    driver: bridge
