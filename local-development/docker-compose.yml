# Local development only. Every variable has a default that matches application-local.properties, so no
# .env file is needed. To override a value (or to pass OPENAI_API_KEY), set it in your shell or in
# local-development/.env (see .env.example).
#
# `docker compose up` starts only the backing services and the Dozzle log viewer (run the app from the IDE with
# the local profile).
# `docker compose --profile full up --build` also builds and starts the app container (local profile).
# `--profile ollama` also starts Ollama and pulls the model (about 4.7 GB) for the opt-in local verifier.
services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: knowgauge-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowgauge}
      POSTGRES_USER: ${POSTGRES_USER:-knowgauge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowgauge_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [knowgauge-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-vectors:
    image: pgvector/pgvector:pg15
    container_name: knowgauge-postgres-vectors
    environment:
      POSTGRES_DB: ${POSTGRES_VECTORS_DB:-knowgauge_vectors}
      POSTGRES_USER: ${POSTGRES_VECTORS_USER:-knowgauge_user}
      POSTGRES_PASSWORD: ${POSTGRES_VECTORS_PASSWORD:-knowgauge_pass}
    ports:
      - "5433:5432"   # host 5433 -> container 5432 (avoid conflict with main)
    volumes:
      - postgres_vectors_data:/var/lib/postgresql/data
    networks: [knowgauge-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # minio/minio was deleted from Docker Hub (and quay.io/minio/minio closed to anonymous pulls) in Sept 2026.
    # Chainguard's image runs the same MinIO server. It runs as UID 65532 by default; root avoids
    # "file access denied" on the named volume. It has no shell or curl, so there is no healthcheck.
    image: cgr.dev/chainguard/minio:latest
    container_name: knowgauge-minio
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks: [knowgauge-network]

  # Log viewer for every container on this Docker host: http://localhost:8888 (live tail, search, level filters,
  # JSON shown as fields). No login, so it listens on localhost only. Reads the Docker socket and stores nothing.
  dozzle:
    image: amir20/dozzle:latest
    container_name: knowgauge-dozzle
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [knowgauge-network]

  # Opt-in local LLM for distractor verification (kg.testgen.verification.provider=ollama). Not started by default.
  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    container_name: knowgauge-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks: [knowgauge-network]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: pulls the verification model into the ollama volume, then exits.
  ollama-pull:
    profiles: [ollama]
    image: ollama/ollama:latest
    container_name: knowgauge-ollama-pull
    entrypoint: ["ollama", "pull", "${KG_OLLAMA_MODEL:-qwen2.5:7b-instruct}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks: [knowgauge-network]
    restart: "no"

  knowgauge-service:
    profiles: [full]
    image: knowgauge-service
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: knowgauge-service
    environment:
      SPRING_PROFILES_ACTIVE: local

      # Main DB (Spring default datasource)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-knowgauge}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-knowgauge_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-knowgauge_pass}

      # Vector DB (kg.pgvector.datasource.*, bound to DataSourceProperties)
      KG_PGVECTOR_DATASOURCE_URL: jdbc:postgresql://postgres-vectors:5432/${POSTGRES_VECTORS_DB:-knowgauge_vectors}
      KG_PGVECTOR_DATASOURCE_USERNAME: ${POSTGRES_VECTORS_USER:-knowgauge_user}
      KG_PGVECTOR_DATASOURCE_PASSWORD: ${POSTGRES_VECTORS_PASSWORD:-knowgauge_pass}
      KG_PGVECTOR_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      # MinIO (kg.storage.endpoint / accessKey / secretKey)
      KG_STORAGE_ENDPOINT: http://minio:9000
      KG_STORAGE_ACCESSKEY: ${MINIO_ROOT_USER:-minio}
      KG_STORAGE_SECRETKEY: ${MINIO_ROOT_PASSWORD:-minio12345}

      # OpenAI (no default; needed for ingestion and test generation)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # Ollama verifier, only used with KG_TESTGEN_VERIFICATION_PROVIDER=ollama and `--profile ollama`
      KG_TESTGEN_VERIFICATION_PROVIDER: ${KG_TESTGEN_VERIFICATION_PROVIDER:-openai}
      KG_TESTGEN_VERIFICATION_CHATMODEL_OLLAMA_BASEURL: http://ollama:11434
      KG_TESTGEN_VERIFICATION_CHATMODEL_OLLAMA_MODEL: ${KG_OLLAMA_MODEL:-qwen2.5:7b-instruct}

      # Uncomment for JSON logs (as in prod) instead of plain text, e.g. to try field filters in Dozzle
      # LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs

      # Optional debug
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "8080:8080"
      - "5005:5005"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-vectors:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [knowgauge-network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  postgres_vectors_data:
  minio_data:
  ollama_data:

networks:
  knowgauge-network:
    driver: bridge
