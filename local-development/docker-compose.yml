# Local development only. Every variable has a default that matches application-dev.properties, so no
# .env file is needed. To override a value (or to pass OPENAI_API_KEY), set it in your shell or in
# local-development/.env (see .env.example).
#
# `docker compose up` starts only the backing services (run the app from the IDE with the dev profile).
# `docker compose --profile full up --build` also builds and starts the app container.
services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: knowgauge-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowgauge}
      POSTGRES_USER: ${POSTGRES_USER:-knowgauge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowgauge_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [knowgauge-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-vectors:
    image: pgvector/pgvector:pg15
    container_name: knowgauge-postgres-vectors
    environment:
      POSTGRES_DB: ${POSTGRES_VECTORS_DB:-knowgauge_vectors}
      POSTGRES_USER: ${POSTGRES_VECTORS_USER:-knowgauge_user}
      POSTGRES_PASSWORD: ${POSTGRES_VECTORS_PASSWORD:-knowgauge_pass}
    ports:
      - "5433:5432"   # host 5433 -> container 5432 (avoid conflict with main)
    volumes:
      - postgres_vectors_data:/var/lib/postgresql/data
    networks: [knowgauge-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: knowgauge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks: [knowgauge-network]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local LLM for distractor verification (kg.testgen.verification.provider=ollama in dev/docker).
  ollama:
    image: ollama/ollama:latest
    container_name: knowgauge-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks: [knowgauge-network]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: pulls the verification model into the ollama volume, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: knowgauge-ollama-pull
    entrypoint: ["ollama", "pull", "${KG_OLLAMA_MODEL:-qwen2.5:7b-instruct}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks: [knowgauge-network]
    restart: "no"

  knowgauge-service:
    profiles: [full]
    image: knowgauge-service
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: knowgauge-service
    environment:
      SPRING_PROFILES_ACTIVE: docker

      # Main DB (Spring default datasource)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-knowgauge}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-knowgauge_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-knowgauge_pass}

      # Vector DB (kg.pgvector.datasource.*, bound to DataSourceProperties)
      KG_PGVECTOR_DATASOURCE_URL: jdbc:postgresql://postgres-vectors:5432/${POSTGRES_VECTORS_DB:-knowgauge_vectors}
      KG_PGVECTOR_DATASOURCE_USERNAME: ${POSTGRES_VECTORS_USER:-knowgauge_user}
      KG_PGVECTOR_DATASOURCE_PASSWORD: ${POSTGRES_VECTORS_PASSWORD:-knowgauge_pass}
      KG_PGVECTOR_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      # MinIO (kg.storage.accessKey / secretKey)
      KG_STORAGE_ACCESSKEY: ${MINIO_ROOT_USER:-minio}
      KG_STORAGE_SECRETKEY: ${MINIO_ROOT_PASSWORD:-minio12345}

      # OpenAI (no default; needed for ingestion and test generation)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # Ollama verifier (kg.testgen.verification.chat-model.ollama.*)
      KG_OLLAMA_BASE_URL: http://ollama:11434
      KG_TESTGEN_VERIFICATION_CHATMODEL_OLLAMA_MODEL: ${KG_OLLAMA_MODEL:-qwen2.5:7b-instruct}

      # Optional debug
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "8080:8080"
      - "5005:5005"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-vectors:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    networks: [knowgauge-network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  postgres_vectors_data:
  minio_data:
  ollama_data:

networks:
  knowgauge-network:
    driver: bridge
