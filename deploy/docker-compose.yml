# Production-style deployment on a single server: the app (prod profile), one Postgres (schemas knowgauge, vectors
# and keycloak), Keycloak for sign-in, MinIO, the web UI and the Dozzle log viewer. See deploy/README.md for the
# first-time setup.
#
#   cp .env.example .env        # then fill in the secrets
#   docker compose up -d --build
#
# Only the UI is published on the network (KG_HTTP_PORT, default 80); it forwards /api to the app. Keycloak listens
# on 127.0.0.1 for a reverse proxy with HTTPS (KG_AUTH_URL). Postgres, MinIO and the app are reachable only inside the
# compose network. Dozzle listens on 127.0.0.1 and needs a login.
name: knowgauge

# Every container rotates its Docker log: at most 3 files of 20 MB. This is also how far back Dozzle can show.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  # One Postgres for everything (ADR011): database knowgauge with the schemas knowgauge (app), vectors (embeddings,
  # pgvector) and keycloak (Keycloak, own login). ../postgres/initdb creates them when the volume is first created.
  # One pg_dump of this database backs up all three.
  postgres:
    image: pgvector/pgvector:pg15
    container_name: knowgauge-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowgauge}
      POSTGRES_USER: ${POSTGRES_USER:-knowgauge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak_user}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in deploy/.env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks: [knowgauge-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sign-in (ADR010), in production mode. Tables in the keycloak schema of the shared Postgres. The knowgauge realm
  # (../keycloak/knowgauge-realm.json, the template shared with local-development/: UI client and the first admin's
  # sign-in; no roles) is imported on the first start only, with its ${VAR:default} placeholders filled from the
  # environment below. It listens on 127.0.0.1: put a reverse proxy with HTTPS in front of it at KG_AUTH_URL.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: knowgauge-keycloak
    restart: unless-stopped
    logging: *default-logging
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-knowgauge}
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak_user}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Public address (the token issuer); HTTP inside, HTTPS terminated by the reverse proxy
      KC_HOSTNAME: ${KG_AUTH_URL:?Set KG_AUTH_URL (public Keycloak address, e.g. https://auth.example.com) in deploy/.env}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Keycloak's own admin (master realm), for the admin console
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set KC_BOOTSTRAP_ADMIN_PASSWORD in deploy/.env}
      # Placeholders of the realm import
      KG_ADMIN_EMAIL: ${KG_ADMIN_EMAIL:?Set KG_ADMIN_EMAIL (the first KnowGauge admin) in deploy/.env}
      KG_ADMIN_PASSWORD: ${KG_ADMIN_PASSWORD:?Set KG_ADMIN_PASSWORD (temporary, changed at the first sign-in) in deploy/.env}
      KG_PUBLIC_UI_URL: ${KG_PUBLIC_UI_URL}
      KG_MAIL_HOST: ${KG_MAIL_HOST:-}
      KG_MAIL_PORT: ${KG_MAIL_PORT:-587}
      KG_MAIL_USERNAME: ${KG_MAIL_USERNAME:-}
      KG_MAIL_PASSWORD: ${KG_MAIL_PASSWORD:-}
      KG_MAIL_SMTP_AUTH: ${KG_MAIL_SMTP_AUTH:-true}
      KG_MAIL_STARTTLS: ${KG_MAIL_STARTTLS:-true}
      KG_MAIL_FROM_ADDRESS: ${KG_MAIL_FROM_ADDRESS:-no-reply@knowgauge.local}
    ports:
      - "127.0.0.1:${KG_KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ../keycloak/knowgauge-realm.json:/opt/keycloak/data/import/knowgauge-realm.json:ro
      - ./keycloak/knowgauge-users-0.json:/opt/keycloak/data/import/knowgauge-users-0.json:ro
      # The KnowGauge login theme, built in the know-gauge-ui clone with `npm run build-keycloak-theme`
      - ${KG_UI_SOURCE:-../../know-gauge-ui}/dist_keycloak:/opt/keycloak/providers:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [knowgauge-network]

  minio:
    # Same image and settings as local-development (minio/minio is no longer published). Runs as root so it can
    # write to the named volume. No healthcheck: the image has no shell or curl.
    image: cgr.dev/chainguard/minio:latest
    container_name: knowgauge-minio
    restart: unless-stopped
    logging: *default-logging
    user: "0:0"
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-knowgauge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in deploy/.env (at least 8 characters)}
    volumes:
      - minio_data:/data
    networks: [knowgauge-network]

  knowgauge-service:
    image: knowgauge-service
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: knowgauge-service
    restart: unless-stopped
    logging: *default-logging
    environment:
      # The image defaults to the prod profile: every setting comes from these variables
      # (see knowgauge-service-rest-api/src/main/resources/application-prod.properties).
      SPRING_PROFILES_ACTIVE: prod

      # One database, two schemas of the app (ADR011)
      KG_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-knowgauge}?currentSchema=knowgauge
      KG_DB_USERNAME: ${POSTGRES_USER:-knowgauge_user}
      KG_DB_PASSWORD: ${POSTGRES_PASSWORD}

      KG_VECTOR_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-knowgauge}?currentSchema=vectors
      KG_VECTOR_DB_USERNAME: ${POSTGRES_USER:-knowgauge_user}
      KG_VECTOR_DB_PASSWORD: ${POSTGRES_PASSWORD}

      # Sign-in through the keycloak service (ADR010). Tokens carry the public issuer; the app fetches the signing
      # keys inside the network.
      KG_SECURITY_MODE: oidc
      KG_OIDC_ISSUER_URI: ${KG_AUTH_URL}/realms/knowgauge
      KG_OIDC_JWK_SET_URI: http://keycloak:8080/realms/knowgauge/protocol/openid-connect/certs
      # The first admin: gets the ADMIN role at sign-in once the email is verified (ADR012)
      KG_ADMIN_EMAIL: ${KG_ADMIN_EMAIL}

      KG_STORAGE_ENDPOINT: http://minio:9000
      KG_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-knowgauge}
      KG_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      KG_STORAGE_BUCKET: ${KG_STORAGE_BUCKET:-knowgauge-content}
      KG_STORAGE_CREATE_BUCKET: "true"

      # Invitation emails (ADR009): your SMTP server, and the public address of the UI for the links
      KG_MAIL_HOST: ${KG_MAIL_HOST:-}
      KG_MAIL_PORT: ${KG_MAIL_PORT:-587}
      KG_MAIL_USERNAME: ${KG_MAIL_USERNAME:-}
      KG_MAIL_PASSWORD: ${KG_MAIL_PASSWORD:-}
      KG_MAIL_FROM: ${KG_MAIL_FROM:-KnowGauge <no-reply@knowgauge.local>}
      KG_PUBLIC_UI_URL: ${KG_PUBLIC_UI_URL:?Set KG_PUBLIC_UI_URL (the address participants open) in deploy/.env}

      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in deploy/.env}

      # AI tokens each workspace may use per month (default 1000000; an admin can override it on System settings)
      KG_TENANT_MONTHLY_TOKEN_LIMIT: ${KG_TENANT_MONTHLY_TOKEN_LIMIT:-1000000}
      KG_TENANT_STORAGE_LIMIT_MB: ${KG_TENANT_STORAGE_LIMIT_MB:-500}
      KG_CONCURRENT_GENERATIONS_PER_USER: ${KG_CONCURRENT_GENERATIONS_PER_USER:-1}

      # Only used in security mode fixed (no sign-in); application-prod.properties needs a value.
      KG_TENANT_ID: ${KG_TENANT_ID:-1}
      KG_USER_ID: ${KG_USER_ID:-}

      # JSON logs (ECS); Dozzle shows them as fields. KG_LOG_LEVEL applies to com.knowgauge.
      KG_LOG_FORMAT: ${KG_LOG_FORMAT:-ecs}
      KG_LOG_LEVEL: ${KG_LOG_LEVEL:-INFO}
      KG_ENVIRONMENT: ${KG_ENVIRONMENT:-prod}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      keycloak:
        condition: service_started
    networks: [knowgauge-network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  knowgauge-ui:
    image: knowgauge-ui
    # Built from a clone of know-gauge-ui. The default expects it next to this repository.
    build:
      context: ${KG_UI_SOURCE:-../../know-gauge-ui}
    container_name: knowgauge-ui
    restart: unless-stopped
    logging: *default-logging
    environment:
      BACKEND_URL: http://knowgauge-service:8080
      # The app signs in at the public Keycloak address (src/app/config.ts reads these from /config.js)
      OIDC_AUTHORITY: ${KG_AUTH_URL}/realms/knowgauge
      OIDC_CLIENT_ID: knowgauge-ui
    ports:
      - "${KG_HTTP_PORT:-80}:80"
    depends_on:
      knowgauge-service:
        condition: service_healthy
    networks: [knowgauge-network]

  dozzle:
    # Log viewer. Login from dozzle/users.yml (see deploy/README.md). It can read every container's logs, so it
    # listens on 127.0.0.1 only: open it through an SSH tunnel or a reverse proxy with HTTPS.
    image: amir20/dozzle:latest
    container_name: knowgauge-dozzle
    restart: unless-stopped
    logging: *default-logging
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_AUTH_TTL: 48h
      DOZZLE_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:${DOZZLE_PORT:-8888}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle:/data
    networks: [knowgauge-network]

volumes:
  db_data:
  minio_data:

networks:
  knowgauge-network:
    driver: bridge
