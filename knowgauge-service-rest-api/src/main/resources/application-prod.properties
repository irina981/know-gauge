# ===============================
# Production. Every environment-specific value comes from an environment variable. The required ones have no
# default, so the app fails at startup when one is missing. Optional ones show their default after the colon.
#
# Required: KG_DB_URL, KG_DB_USERNAME, KG_DB_PASSWORD,
#           KG_VECTOR_DB_URL, KG_VECTOR_DB_USERNAME, KG_VECTOR_DB_PASSWORD,
#           KG_STORAGE_ENDPOINT, KG_STORAGE_ACCESS_KEY, KG_STORAGE_SECRET_KEY,
#           OPENAI_API_KEY, KG_TENANT_ID
# ===============================

# --- Primary DB ---
spring.datasource.url=${KG_DB_URL}
spring.datasource.username=${KG_DB_USERNAME}
spring.datasource.password=${KG_DB_PASSWORD}

# --- Flyway: schema only, no seed data ---
spring.flyway.locations=classpath:db/migration

# --- Logging ---
logging.level.com.knowgauge=${KG_LOG_LEVEL:INFO}

# --- Actuator: health, info and metrics only (env and beans expose configuration) ---
management.endpoints.web.exposure.include=${KG_ACTUATOR_ENDPOINTS:health,info,metrics}

# --- OpenAPI / Swagger UI ---
springdoc.api-docs.enabled=${KG_SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${KG_SWAGGER_ENABLED:false}

# ===============================
# KnowGauge (custom properties)
# ===============================

# --- Execution context (no authentication yet: one tenant per deployment) ---
kg.context.tenant-id=${KG_TENANT_ID}
kg.context.user-id=${KG_USER_ID:}

# --- PGVector DB ---
kg.pgvector.datasource.url=${KG_VECTOR_DB_URL}
kg.pgvector.datasource.username=${KG_VECTOR_DB_USERNAME}
kg.pgvector.datasource.password=${KG_VECTOR_DB_PASSWORD}

# --- Object storage (MinIO / S3-compatible). The bucket must exist. ---
kg.storage.endpoint=${KG_STORAGE_ENDPOINT}
kg.storage.accessKey=${KG_STORAGE_ACCESS_KEY}
kg.storage.secretKey=${KG_STORAGE_SECRET_KEY}
kg.storage.bucket=${KG_STORAGE_BUCKET:knowgauge-content}

# --- No seed data ---
kg.dev.seed.enabled=false

# --- LLM models ---
kg.testgen.defaults.generation-model=${KG_GENERATION_MODEL:gpt-4.1}
kg.testgen.verification.provider=${KG_VERIFICATION_PROVIDER:openai}
kg.testgen.verification.chat-model.openai.model=${KG_VERIFICATION_MODEL:gpt-4.1}
kg.testgen.verification.chat-model.ollama.base-url=${KG_OLLAMA_BASE_URL:http://localhost:11434}

# --- Scheduled ingestion job ---
kg.ingestion.job.enabled=${KG_INGESTION_JOB_ENABLED:true}
kg.ingestion.job.cron=${KG_INGESTION_JOB_CRON:0 */5 * * * *}
kg.ingestion.job.batch-size=${KG_INGESTION_JOB_BATCH_SIZE:5}
