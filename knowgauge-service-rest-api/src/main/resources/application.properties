spring.config.import=classpath:resilience4j.properties

# ===============================
# Application
# ===============================
spring.application.name=knowgauge-service

# ===============================
# Security (ADR010)
# ===============================
# No in-memory login user: the app either has no sign-in (fixed) or takes Keycloak bearer tokens (oidc).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ===============================
# Multipart limits (uploads)
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,env,beans,loggers
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# ===============================
# OpenAPI / Swagger UI
# ===============================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# Logging (defaults; profiles override)
# ===============================
logging.level.org.springframework=INFO
logging.level.com.knowgauge=INFO
logging.level.org.flywaydb=INFO

# ===============================
# JPA / Hibernate (primary DB)
# ===============================
# Datasources are set per profile: local (localhost), test (supplied by the test), prod (env vars).
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Flyway (primary DB)
# ===============================
# One Postgres database holds three schemas (ADR011): knowgauge (this one), vectors (below) and keycloak. Each
# datasource URL selects its schema with ?currentSchema=..., and each Flyway keeps its history in its own schema.
spring.flyway.enabled=true
spring.flyway.schemas=knowgauge
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===============================
# KnowGauge (custom properties)
# ===============================

# --- Security mode (ADR010) ---
# fixed: no sign-in; every request runs as the tenant and user of kg.context.tenant-id / user-id.
# oidc:  Keycloak bearer tokens; each user works in their own tenant (created on the first sign-in).
kg.security.mode=fixed
# The token's aud must contain this (the realm's audience mapper adds it). Issuer and keys are set per profile.
kg.security.oidc.audience=knowgauge-api
kg.security.oidc.account-cache-minutes=10

# --- PGVector JPA (vectors schema entity manager) ---
kg.pgvector.datasource.driver-class-name=org.postgresql.Driver
kg.pgvector.jpa.hibernate.ddl-auto=validate
kg.pgvector.jpa.show-sql=false
kg.pgvector.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
kg.pgvector.jpa.properties.hibernate.format_sql=true

# --- PGVector Flyway (vectors schema) ---
kg.pgvector.flyway.enabled=true
kg.pgvector.flyway.baseline-on-migrate=true
kg.pgvector.flyway.locations=classpath:db/pgvector-migration
kg.pgvector.flyway.schemas=vectors

# --- Storage (shared) ---
# Endpoint and credentials are set per profile.
kg.storage.type=minio
kg.storage.bucket=knowgauge-content
kg.storage.storage-key-template={tenantId}/docs/by-id/{shard3}/{documentId}/v{version}/source/content

# --- Storage timeouts (seconds) ---
kg.storage.connectTimeout=3
kg.storage.readTimeout=20
kg.storage.writeTimeout=20
kg.storage.callTimeout=25

# --- Chunking ---
kg.chunking.maxChunkSizeChars=700
kg.chunking.overlapSizeChars=120
kg.chunking.trimWhitespace=true
kg.chunking.includePageMetadata=true

# --- Scheduled ingestion job: ingests the oldest UPLOADED documents of the tenant ---
# Cron has six fields (second minute hour day month weekday). Default: every 5 minutes.
kg.ingestion.job.enabled=true
kg.ingestion.job.cron=0 */5 * * * *
kg.ingestion.job.batch-size=20

# --- Embeddings / LLM provider ---
# OPENAI_API_KEY comes from the environment in every profile (the test profile has a placeholder).
kg.embedding.dimension=1536
kg.embedding.provider=openai
kg.embedding.openai.api-key=${OPENAI_API_KEY}
kg.embedding.openai.model=text-embedding-3-small
kg.embedding.openai.base-url=https://api.openai.com/v1
kg.embedding.openai.timeout=30

# --- Test Generation Defaults (overridden by values provided in Test request/domain) ---
kg.testgen.prompt.templates.classpathBase=prompttemplates/
kg.testgen.prompt.templates.output-schema-file=mcq-output-template.json
kg.testgen.defaults.difficulty=MEDIUM
kg.testgen.defaults.avoid-repeats=true
kg.testgen.defaults.coverage-mode=BALANCED_PER_DOC_CHUNKS
kg.testgen.defaults.question-count=10
kg.testgen.defaults.answer-cardinality=SINGLE_CORRECT
kg.testgen.defaults.language=EN
kg.testgen.defaults.prompt-template-id=mcq-default
kg.testgen.defaults.generation-model=gpt-5.6-luna
kg.testgen.defaults.chunks-per-question=4
kg.testgen.defaults.min-chunks-per-test=20
# Generation fails (422) when retrieval returns fewer than questionCount x this many chunks
kg.testgen.defaults.min-chunks-per-question=1
# FOCUSED tests only: at most two questions per chunk (retrieval returns only chunks about the focus)
kg.testgen.defaults.focused-min-chunks-per-question=0.5
kg.testgen.defaults.question-generation-batch-size=5
kg.testgen.defaults.min-multiple-correct-percentage=50
kg.testgen.defaults.max-consecutive-zero-progress-batches=1

# --- ChatModel Defaults for Test Generation (overridden by Test fields / generationParams) ---
kg.testgen.chat-model.openai.api-key=${OPENAI_API_KEY}
kg.testgen.chat-model.openai.model=${kg.testgen.defaults.generation-model}
kg.testgen.chat-model.openai.temperature=0.2
kg.testgen.chat-model.openai.max-output-tokens=1200
kg.testgen.chat-model.openai.timeout-seconds=60
kg.testgen.chat-model.openai.structured-output-model-prefixes=gpt-4.1,gpt-4o,gpt-5,o1,o3,o4
# Reasoning models (prefixes) get no temperature, max-completion tokens instead of max-output-tokens (they also
# cover the hidden reasoning tokens) and a reasoning effort. Applies to generation and verification.
kg.testgen.chat-model.openai.reasoning-model-prefixes=gpt-5
kg.testgen.chat-model.openai.reasoning-effort=low
kg.testgen.chat-model.openai.reasoning-max-completion-tokens=8000

# --- Verification Model for Incorrect Options (MULTIPLE_CORRECT questions) ---
# Provider: openai or ollama (opt-in local model, no OpenAI tokens; judged distractors unreliably, see ADR003).
kg.testgen.verification.provider=openai

# OpenAI verifier. Falls back to the main chat model if not configured.
kg.testgen.verification.chat-model.openai.model=gpt-4.1
kg.testgen.verification.chat-model.openai.max-output-tokens=2000
kg.testgen.verification.chat-model.openai.temperature=0
kg.testgen.verification.chat-model.openai.timeout-seconds=60

# Ollama verifier (used when provider=ollama). The model must be pulled first: ollama pull <model>
kg.testgen.verification.chat-model.ollama.base-url=http://localhost:11434
kg.testgen.verification.chat-model.ollama.model=qwen2.5:7b-instruct
# CPU-only Ollama (e.g. in Docker on Windows) writes about 7 tokens/s, so a full reply can take minutes.
kg.testgen.verification.chat-model.ollama.max-output-tokens=2000
kg.testgen.verification.chat-model.ollama.temperature=0
kg.testgen.verification.chat-model.ollama.timeout-seconds=600
# Prompt + reply tokens. The prompt includes the cited source chunks; Ollama's own default (4096) can truncate it.
kg.testgen.verification.chat-model.ollama.context-length=8192

kg.testgen.verification.prompt.templates.classpathBase=prompttemplates/
kg.testgen.verification.prompt.templates.output-schema-file=verification-output-template.json
kg.testgen.verification.defaults.prompt-template-id=incorrect-options-verification

# --- Invitation emails (ADR009) ---
# SMTP itself is spring.mail.* (set per profile). A failed send is stored on the invitation, so SMTP being down
# must not mark the whole service DOWN.
management.health.mail.enabled=false
kg.invitations.max-per-request=200

# --- FOCUSED coverage: which chunks count as about the focus text (cosine distance, text-embedding-3-small) ---
kg.retrieval.focused.max-distance=0.65
kg.retrieval.focused.max-gap-to-best=0.20
