<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KnowGauge</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #ffffff;
            --text: #1a1b1e;
            --muted: #868e96;
            --link: #4c6ef5;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1b1e;
                --text: #e9ecef;
                --muted: #909296;
                --link: #748ffc;
            }
        }
        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0 16px;
            text-align: center;
        }
        .container {
            margin-top: 96px;
        }
        img {
            width: 320px;
            max-width: 100%;
        }
        p {
            font-size: 1.1rem;
            color: var(--muted);
        }
        a {
            color: var(--link);
        }
    </style>
</head>
<body>
<div class="container">
    <picture>
        <source srcset="/logo-dark.svg" media="(prefers-color-scheme: dark)">
        <img src="/logo.svg" alt="KnowGauge">
    </picture>
    <p>RAG-powered test generation from your documents</p>
    <p><a href="/swagger-ui.html">API documentation</a></p>
</div>
</body>
</html>
