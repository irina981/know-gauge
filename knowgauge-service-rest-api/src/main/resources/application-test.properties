# ===============================
# Automated tests only (@ActiveProfiles("test")).
# Datasources and the MinIO endpoint are supplied by the test itself, for example with Testcontainers
# (@ServiceConnection / @DynamicPropertySource). Nothing here reaches a real external service.
# ===============================

# --- Flyway: schema only; tests create their own data ---
spring.flyway.locations=classpath:db/migration

# --- Logging ---
logging.level.com.knowgauge=DEBUG

# ===============================
# KnowGauge (custom properties)
# ===============================

# --- Execution context (no authentication yet) ---
kg.context.tenant-id=1
kg.context.user-id=1

# --- No seed data ---
kg.dev.seed.enabled=false

# --- No scheduled ingestion: tests call IngestionService directly ---
kg.ingestion.job.enabled=false

# --- OpenAI: placeholder key so the context starts without OPENAI_API_KEY. Tests mock the LLM and embedding ports. ---
kg.embedding.openai.api-key=${OPENAI_API_KEY:test-not-a-real-key}
kg.testgen.chat-model.openai.api-key=${OPENAI_API_KEY:test-not-a-real-key}
