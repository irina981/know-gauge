# ===============================
# Local development: the app from the IDE against local-development/docker-compose.yml.
# The app container in that compose file uses this profile too and overrides the hosts through env vars
# (SPRING_DATASOURCE_URL, KG_PGVECTOR_DATASOURCE_URL, KG_STORAGE_ENDPOINT).
# Local credentials only; never reuse them elsewhere.
# ===============================

spring.jpa.show-sql=true

# --- Primary DB (localhost:5432) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/knowgauge
spring.datasource.username=knowgauge_user
spring.datasource.password=knowgauge_pass

# --- Flyway: schema + seed topic tree (R__dev_seed_topics.sql) ---
spring.flyway.locations=classpath:db/migration,classpath:db/dev-migration

# --- Logging ---
logging.level.dev.langchain4j=DEBUG
logging.level.com.knowgauge=DEBUG
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

# ===============================
# KnowGauge (custom properties)
# ===============================

# --- Execution context (no authentication yet) ---
kg.context.tenant-id=1
kg.context.user-id=1

# --- PGVector DB (localhost:5433) ---
kg.pgvector.datasource.url=jdbc:postgresql://localhost:5433/knowgauge_vectors
kg.pgvector.datasource.username=knowgauge_user
kg.pgvector.datasource.password=knowgauge_pass

# --- MinIO (localhost:9000) ---
kg.storage.endpoint=http://localhost:9000
kg.storage.accessKey=minio
kg.storage.secretKey=minio12345

# --- Seed: creates the MinIO bucket and uploads the PDFs from resources/devdocs/ at startup ---
kg.dev.seed.enabled=true

# --- Distractor verification ---
# OpenAI gpt-4.1 (from application.properties). To try the local Ollama model, start compose with
# `--profile ollama` and set kg.testgen.verification.provider=ollama (ADR003: it judged distractors unreliably).
kg.testgen.verification.chat-model.ollama.base-url=http://localhost:11434
